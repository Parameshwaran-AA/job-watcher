<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181d; --ground:#fafbfc; --panel:#fff; --rule:#e4e8ed;
  --muted:#67727e; --faint:#9aa4ae; --signal:#b4234b; --bar:#2c343d;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#e8ecf0; --ground:#101318; --panel:#161a20; --rule:#272d35;
         --muted:#98a2ad; --faint:#6b7581; --signal:#f2789b; --bar:#c3ccd6; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}

header{margin-bottom:22px}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.status{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0}
.status b{color:var(--ink);font-weight:500}

.controls{position:sticky;top:0;z-index:5;background:var(--ground);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:12px 0;margin-bottom:2px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{font-size:11.5px;color:var(--faint)}
input,select{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:6px 8px;height:32px}
input:focus-visible,select:focus-visible,a:focus-visible,button:focus-visible{
  outline:2px solid var(--signal);outline-offset:1px}
.multi{position:relative}
#multiBtn{width:220px;text-align:left;font-family:var(--sans);font-size:13.5px;
  color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:6px 26px 6px 8px;height:32px;cursor:pointer;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#multiBtn::after{content:"\25BE";position:absolute;right:9px;top:7px;color:var(--faint)}
.menu{position:absolute;top:36px;left:0;z-index:20;width:260px;max-height:340px;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.menu[hidden]{display:none}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.bar button{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--rule);border-radius:6px;padding:6px 11px;cursor:pointer}
.bar button:hover{border-color:var(--bar)}
.bar button.on{border-color:var(--signal);color:var(--signal)}
.bar .sep{flex:1}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55)}
.modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  width:min(430px,calc(100vw - 40px));padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.card h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.card .jt{font-size:15px;color:var(--ink);line-height:1.35;margin-bottom:4px}
.card .jc{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.card .acts{display:flex;gap:9px}
.card .acts button{flex:1;font-family:var(--sans);font-size:13px;padding:9px;border-radius:7px;
  cursor:pointer;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.card .acts button.primary{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
.panel{border:1px solid var(--rule);border-radius:10px;margin-bottom:16px;overflow:hidden}
.panel[hidden]{display:none}
.panel .ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule);
  font-size:12.5px;color:var(--muted)}
.panel .ph .sep{flex:1}
.panel .pr{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;color:var(--ink);
  border-bottom:1px solid var(--rule)}
.panel .pr:last-child{border-bottom:none}
.panel .pr .when{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:78px}
.panel .pr .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .pr button{font-family:var(--sans);font-size:11.5px;color:var(--muted);background:none;
  border:1px solid var(--rule);border-radius:5px;padding:3px 8px;cursor:pointer;flex:none}
.menu-head{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--rule)}
.menu-head button{flex:1;font-family:var(--sans);font-size:12.5px;color:var(--ink);
  background:var(--ground);border:1px solid var(--rule);border-radius:5px;padding:5px;cursor:pointer}
.menu-list{overflow-y:auto;padding:4px}
.menu-list label{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13.5px;
  border-radius:5px;cursor:pointer}
.menu-list label:hover{background:var(--ground)}
.menu-list input{width:15px;height:15px;accent-color:var(--bar);cursor:pointer;flex-shrink:0}
.menu-list .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
#score{width:120px;height:auto;padding:0;border:none;background:none;accent-color:var(--bar)}
.reset{align-self:flex-end;background:none;border:none;color:var(--muted);
  font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:6px 2px;text-decoration:underline}

.chk{flex-direction:row;align-items:center;gap:6px;align-self:flex-end;padding-bottom:7px;
     font-size:12.5px;color:var(--muted);cursor:pointer}
.chk input{width:14px;height:14px;padding:0;accent-color:var(--bar);cursor:pointer}
.over{color:var(--faint);font-size:12px;margin-left:7px;font-style:italic}
.h1b{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.02em;padding:1px 6px;border-radius:4px;margin-left:8px;
  border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.h1b.yes{border-color:#1f6f4a;color:#4bbd8a}
.h1b.no{border-color:var(--rule);color:var(--faint)}
.h1b.cap{border-color:#5b4a9c;color:#a394f0}
.ref{font-family:var(--sans);font-size:11.5px;color:var(--muted);text-decoration:none;
  border:1px solid var(--rule);border-radius:5px;padding:2px 7px;margin-left:8px;white-space:nowrap}
.ref:hover{border-color:var(--bar);color:var(--ink)}
button.ref{font-family:var(--sans);background:none;cursor:pointer;line-height:1.35}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  padding:11px 16px;font-size:13px;color:var(--ink);max-width:520px;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.card select{width:100%;font-family:var(--sans);font-size:13px;padding:8px 9px;border-radius:7px;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink);margin-bottom:14px}
.panel .pr .stage{font-family:var(--sans);font-size:11px;padding:2px 7px;border-radius:4px;
  border:1px solid var(--rule);color:var(--muted);flex:none}
.panel .pr .stage.reply{border-color:#1f6f4a;color:#4bbd8a}
.panel .pr .stage.dead{border-color:#7a3536;color:#e07a7a}
.panel .pr .age{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:104px;text-align:right}
.panel .pr.stale .grow{opacity:.5}
.count{font-family:var(--mono);font-size:12px;color:var(--faint);padding:10px 0 2px}

.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:baseline;
     padding:13px 0;border-bottom:1px solid var(--rule)}
.title{font-size:15px;font-weight:500;margin:0;text-decoration:none;color:var(--ink)}
.title:hover{text-decoration:underline}
.sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.co{color:var(--ink);background:none;border:none;padding:0;font:inherit;
    cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);
    text-underline-offset:2px}
.co:hover{text-decoration-color:var(--signal)}
.new{color:var(--signal);font-weight:600;margin-right:7px;font-size:13px}
.num{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;
     white-space:nowrap;min-width:62px}
.sc{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink);
    text-align:right;min-width:30px}
.gauge{height:2px;background:var(--rule);margin-top:5px;width:34px;margin-left:auto}
.gauge i{display:block;height:2px;background:var(--bar)}
.apply{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);
  border-radius:5px;padding:5px 11px;background:var(--panel);white-space:nowrap}
.apply:hover{border-color:var(--bar)}
.right{display:flex;align-items:center;gap:14px}

.empty{padding:44px 0;color:var(--muted);font-size:14px;max-width:52ch}
.empty code{font-family:var(--mono);font-size:12.5px;background:var(--panel);
  border:1px solid var(--rule);border-radius:4px;padding:1px 5px}
@media (max-width:600px){
  .row{grid-template-columns:1fr auto}
  .num{display:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Job watch</h1>
  <p class="status" id="status">Loading…</p>
</header>

<div class="controls">
  <div class="ctl">
    <label>Companies</label>
    <div class="multi" id="multi">
      <button type="button" id="multiBtn" aria-expanded="false">All companies</button>
      <div class="menu" id="menu" hidden>
        <div class="menu-head">
          <button type="button" id="allBtn">Select all</button>
          <button type="button" id="noneBtn">Clear</button>
        </div>
        <div class="menu-list" id="menuList"></div>
      </div>
    </div>
  </div>
  <div class="ctl">
    <label for="family">Role</label>
    <select id="family">
      <option value="all">All roles</option>
      <option value="swe">Software</option>
      <option value="ai">AI / ML</option>
      <option value="data">Data</option>
    </select>
  </div>
  <div class="ctl">
    <label for="jobtype">Type</label>
    <select id="jobtype">
      <option value="job">Full-time</option>
      <option value="intern">Internships</option>
      <option value="all">Both</option>
    </select>
  </div>
  <div class="ctl">
    <label for="live">Live</label>
    <select id="live">
      <option value="0">Any age</option>
      <option value="7">Under 7 days</option>
      <option value="14">Under 14 days</option>
      <option value="30">Under 30 days</option>
      <option value="60">Under 60 days</option>
    </select>
  </div>
  <div class="ctl">
    <label for="since">Found</label>
    <select id="since">
      <option value="0">Any time</option>
      <option value="24">Last 24 hours</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last 7 days</option>
    </select>
  </div>
  <div class="ctl">
    <label for="sort">Sort</label>
    <select id="sort">
      <option value="found">Newest found</option>
      <option value="score">Best match</option>
      <option value="live">Least competition</option>
      <option value="company">Company</option>
    </select>
  </div>
  <div class="ctl">
    <label for="score">Min match <span id="scoreOut">45</span></label>
    <input type="range" id="score" min="0" max="95" step="5" value="45">
  </div>
  <label class="ctl chk" for="usOnly">
    <input type="checkbox" id="usOnly" checked>
    <span>US only</span>
  </label>
  <label class="ctl chk" for="capOnly">
    <input type="checkbox" id="capOnly">
    <span>Cap-exempt</span>
  </label>
  <label class="ctl chk" for="h1bOnly">
    <input type="checkbox" id="h1bOnly">
    <span>Sponsors H-1B</span>
  </label>
  <label class="ctl chk" for="over">
    <input type="checkbox" id="over">
    <span>Include 8+ yr roles</span>
  </label>
  <button class="reset" id="reset">Clear</button>
</div>

<div class="bar">
  <button type="button" id="appliedBtn">Applied (0)</button>
  <button type="button" id="exportBtn">Download CSV</button>
  <button type="button" id="importBtn">Import CSV</button>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  <span class="sep"></span>
  <button type="button" id="addCoBtn">Add a company</button>
</div>

<div class="panel" id="appliedPanel" hidden>
  <div class="ph"><span id="appliedHead">Applied</span><span class="sep"></span>
    <button type="button" id="closeApplied" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12.5px">close</button>
  </div>
  <div id="appliedList"></div>
</div>

<p class="count" id="count"></p>
<div id="list"></div>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="card">
    <h3 id="modalHead">Did you apply?</h3>
    <div class="jt" id="modalTitle"></div>
    <div class="jc" id="modalCo"></div>
    <select id="modalStage">
      <option value="applied">Applied</option>
      <option value="replied">Recruiter replied</option>
      <option value="screen">Phone screen</option>
      <option value="onsite">Onsite / final</option>
      <option value="offer">Offer</option>
      <option value="rejected">Rejected</option>
    </select>
    <div class="acts">
      <button type="button" id="mLetter">Copy letter prompt</button>
      <button type="button" id="mNo">Not yet</button>
      <button type="button" class="primary" id="mYes">Yes, applied</button>
    </div>
  </div>
</div>

</div>
<script>
const $ = id => document.getElementById(id);
let DATA = {jobs: [], companies: [], generated: 0};
let SELECTED = new Set();   // empty = all companies

// ---- applied jobs -------------------------------------------------------
// Kept in this browser. The Download CSV button is how it leaves; commit that
// file to the repo yourself if you want it on every machine. The page itself
// never writes to GitHub, so no token ever has to live in this public page.
const STORE = "jobwatch.applied.v1";
let APPLIED = {};
try { APPLIED = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { APPLIED = {}; }
const nApplied = () => Object.keys(APPLIED).length;

// Mirror of jobwatch/roles.py. \bintern\b cannot match "internal" or
// "international": the closing boundary fails on the following letter.
const INTERN_RE = /\b(?:interns?|interning|internships?|co-?ops?|apprentice(?:ship)?|trainee)\b/i;
const isIntern = j => j.intern === undefined || j.intern === null
  ? INTERN_RE.test(j.title || "") : j.intern === true;
let CLOSED = {};   // job id -> {closed: epoch}, filled from jobs.json
function saveApplied(){
  try { localStorage.setItem(STORE, JSON.stringify(APPLIED)); } catch (e) {
    alert("This browser is blocking local storage, so the applied list cannot be saved. "
        + "Private windows usually cause this.");
  }
  $("appliedBtn").textContent = "Applied (" + nApplied() + ")";
}

const ago = s => {
  const h = (Date.now()/1000 - s) / 3600;
  if (h < 1) return "just now";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h/24) + "d ago";
};
const expText = j =>
  j.expMin === null || j.expMin === undefined ? "exp not stated"
  : j.expMax ? j.expMin + "\u2013" + j.expMax + " yrs"
  : j.expMin + "+ yrs";

function state(){
  return {
    fam: $("family").value,
    since: +$("since").value,
    sort: $("sort").value,
    min: +$("score").value,
    over: $("over").checked,
    us: $("usOnly").checked,
    type: $("jobtype").value,
    live: +$("live").value,
    h1b: $("h1bOnly").checked,
    cap: $("capOnly").checked
  };
}

function render(){
  const s = state();
  $("scoreOut").textContent = s.min;
  const now = Date.now()/1000;

  let rows = DATA.jobs.filter(j => {
    if (j.score < s.min) return false;
    if (j.over && !s.over) return false;
    if (s.us && j.us === false) return false;
    if (APPLIED[j.id]) return false;
    if (s.type === "job" && isIntern(j)) return false;
    if (s.type === "intern" && !isIntern(j)) return false;
    if (s.live && j.liveDays > s.live) return false;
    if (s.h1b && j.h1b === 0) return false;
    if (s.cap && !j.capExempt) return false;
    if (s.fam !== "all" && j.family !== s.fam) return false;
    if (s.since && (now - j.found) > s.since * 3600) return false;
    if (SELECTED.size && !SELECTED.has(j.company)) return false;
    return true;
  });

  rows.sort((a,b) =>
    s.sort === "score"   ? b.score - a.score :
    s.sort === "live"    ? a.liveDays - b.liveDays :
    s.sort === "company" ? a.company.localeCompare(b.company) || b.found - a.found :
                           b.found - a.found);

  const hidden = DATA.jobs.filter(j => j.over).length;
  const nonUs = DATA.jobs.filter(j => j.us === false).length;
  $("count").textContent =
    rows.length + " of " + DATA.jobs.length + " roles"
    + (SELECTED.size ? " \u00b7 " + SELECTED.size + " compan" + (SELECTED.size === 1 ? "y" : "ies") : "")
    + (!s.over && hidden ? " \u00b7 " + hidden + " hidden as 8+ yrs" : "")
    + (s.us && nonUs ? " \u00b7 " + nonUs + " hidden as non-US" : "")
    + (nApplied() ? " \u00b7 " + nApplied() + " hidden as applied" : "")
    + (s.h1b ? " \u00b7 sponsors only" : "")
    + (s.cap ? " \u00b7 cap-exempt only" : "");

  if (!rows.length){
    $("list").innerHTML = '<p class="empty">Nothing matches. Lower the match threshold, '
      + 'widen the time range, or clear the company filter.</p>';
    return;
  }

  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("list").innerHTML = rows.map(j => {
    const fresh = (now - j.found) < 86400 ? '<span class="new">new</span>' : '';
    const over = j.over ? '<span class="over">asks 8+ yrs</span>' : '';
    const h1b = j.h1b === null || j.h1b === undefined ? ''
      : j.h1b > 0 ? '<span class="h1b yes" title="H-1B petitions approved for this employer, '
          + 'per the USCIS Employer Data Hub">H-1B ' + j.h1b.toLocaleString() + '</span>'
      : '<span class="h1b no" title="No approved H-1B petitions found under this employer name '
          + 'in the USCIS data. Could also be a name-matching miss.">no H-1B record</span>';
    const cap = j.capExempt
      ? '<span class="h1b cap" title="Cap-exempt employer: no H-1B lottery, can file any time of year">cap-exempt</span>'
      : '';
    // Search, not connect. Aim it at people who do this job, then at people who
    // share your school, which is the highest-converting cold approach there is.
    const ROLE = {ai: "machine learning engineer", data: "data engineer", swe: "software engineer"};
    const li = q => 'https://www.linkedin.com/search/results/people/?keywords='
      + encodeURIComponent(q) + '&origin=GLOBAL_SEARCH_HEADER';
    const ref = '<a class="ref" target="_blank" rel="noopener"'
      + ' title="LinkedIn people search for engineers doing this job here"'
      + ' href="' + li(j.company + ' ' + (ROLE[j.family] || 'software engineer')) + '">who works here</a>'
      + '<a class="ref" target="_blank" rel="noopener"'
      + ' title="People at this company who mention University at Buffalo. Shared school is the'
      + ' warmest cold approach available."'
      + ' href="' + li(j.company + ' University at Buffalo') + '">alumni</a>'
      + '<button class="ref" data-letter="' + esc(j.id) + '"'
      + ' title="Copy a ready-to-paste prompt so Claude can draft a tailored note for this job">letter</button>';
    return '<div class="row">'
      + '<div><a class="title" href="' + esc(j.url) + '" target="_blank" rel="noopener">'
      + fresh + esc(j.title) + '</a>'
      + '<p class="sub"><button class="co" data-co="' + esc(j.company) + '">' + esc(j.company) + '</button>'
      + (j.location ? ' &middot; ' + esc(j.location) : '')
      + ' &middot; ' + expText(j) + h1b + cap + ref + '</p></div>'
      + '<div class="num">' + ago(j.found) + '<br>live ' + j.liveDays + 'd</div>'
      + '<div class="right"><div><div class="sc">' + j.score + '</div>'
      + '<div class="gauge"><i style="width:' + j.score + '%"></i></div></div>'
      + '<a class="apply" href="' + esc(j.url) + '" target="_blank" rel="noopener" data-ask="'
      + esc(j.id) + '">Apply</a></div>'
      + '</div>';
  }).join("");
}

// Clicking a company name in a row narrows to just that company.
$("list").addEventListener("click", e => {
  const btn = e.target.closest(".co");
  if (!btn) return;
  SELECTED = new Set([btn.dataset.co]);
  syncMenu(); updateBtnLabel(); render();
});

["family","since","sort","score","over","usOnly","jobtype","live","h1bOnly","capOnly"].forEach(id =>
  $(id).addEventListener("input", render));

$("reset").addEventListener("click", () => {
  SELECTED.clear();
  $("family").value = "all"; $("since").value = "0";
  $("sort").value = "found"; $("score").value = 45; $("over").checked = false;
  $("usOnly").checked = true;
  $("jobtype").value = "job"; $("live").value = "0"; $("h1bOnly").checked = false; $("capOnly").checked = false;
  syncMenu(); updateBtnLabel(); render();
});

// ---- company checkbox dropdown ----
function updateBtnLabel(){
  const n = SELECTED.size;
  $("multiBtn").textContent =
    n === 0 ? "All companies"
    : n === 1 ? [...SELECTED][0]
    : n + " companies selected";
}
function syncMenu(){
  document.querySelectorAll("#menuList input").forEach(cb => {
    cb.checked = SELECTED.has(cb.value);
  });
}
function buildMenu(){
  const counts = {};
  DATA.jobs.forEach(j => { counts[j.company] = (counts[j.company] || 0) + 1; });
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("menuList").innerHTML = DATA.companies.map(c =>
    '<label><input type="checkbox" value="' + esc(c) + '">'
    + '<span>' + esc(c) + '</span><span class="cnt">' + (counts[c] || 0) + '</span></label>'
  ).join("");
  $("menuList").querySelectorAll("input").forEach(cb =>
    cb.addEventListener("change", () => {
      cb.checked ? SELECTED.add(cb.value) : SELECTED.delete(cb.value);
      updateBtnLabel(); render();
    }));
}
$("multiBtn").addEventListener("click", () => {
  const m = $("menu"); const open = !m.hidden;
  m.hidden = open; $("multiBtn").setAttribute("aria-expanded", String(!open));
});
$("allBtn").addEventListener("click", () => {
  SELECTED = new Set(DATA.companies); syncMenu(); updateBtnLabel(); render();
});
$("noneBtn").addEventListener("click", () => {
  SELECTED.clear(); syncMenu(); updateBtnLabel(); render();
});
document.addEventListener("click", e => {
  if (!$("multi").contains(e.target)) {
    $("menu").hidden = true; $("multiBtn").setAttribute("aria-expanded", "false");
  }
});

// ---- did-you-apply prompt ----
let PENDING = null;
function ask(job){
  PENDING = job;
  $("modalTitle").textContent = job.title;
  $("modalCo").textContent = job.company + (job.location ? " \u00b7 " + job.location : "");
  const known = APPLIED[job.id];
  $("modalHead").textContent = known ? "Update this application" : "Did you apply?";
  $("modalStage").value = known ? (known.stage || "applied") : "applied";
  $("modal").hidden = false;
}
$("mNo").addEventListener("click", () => { PENDING = null; $("modal").hidden = true; });
$("mYes").addEventListener("click", () => {
  if (PENDING){
    const prev = APPLIED[PENDING.id] || {};
    const stage = $("modalStage").value;
    APPLIED[PENDING.id] = {
      date: prev.date || new Date().toISOString().slice(0,10),
      stage: stage,
      stageDate: new Date().toISOString().slice(0,10),
      company: PENDING.company, title: PENDING.title,
      location: PENDING.location || "", score: PENDING.score,
      url: PENDING.url, liveDays: PENDING.liveDays
    };
    saveApplied();
  }
  PENDING = null; $("modal").hidden = true;
  if (!$("appliedPanel").hidden) renderApplied();
  render();
});
$("modal").addEventListener("click", e => {
  if (e.target === $("modal")){ PENDING = null; $("modal").hidden = true; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").hidden){ PENDING = null; $("modal").hidden = true; }
});

// Apply opens the posting in a new tab; the prompt waits here for your answer.
$("list").addEventListener("click", e => {
  const a = e.target.closest("a[data-ask]");
  if (!a) return;
  const job = DATA.jobs.find(j => String(j.id) === a.dataset.ask);
  if (job) setTimeout(() => ask(job), 350);
});

// ---- cover letter prompt -----------------------------------------------
// The dashboard cannot read the job description (the ATS blocks cross-origin
// requests) and it should not: storing 1,900 descriptions would bloat the repo.
// So this hands Claude the URL and lets Claude fetch the posting itself.
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 4200);
}
function letterPrompt(j){
  return "Draft a short application note for this job.\n\n"
    + "Role: " + j.title + "\n"
    + "Company: " + j.company + "\n"
    + (j.location ? "Location: " + j.location + "\n" : "")
    + "Posting: " + j.url + "\n\n"
    + "Fetch that posting and read the actual requirements. Use my resume from the "
    + "project doc claude/resume.md. Four to six sentences, not a formal letter: "
    + "open with the single most relevant thing I have built for this specific role, "
    + "give one concrete number, name the one requirement I am weakest on and how I "
    + "would close it, and end plainly. My voice, no filler, no 'I am excited to apply'. "
    + "I am on F-1 OPT and will need sponsorship, so do not claim otherwise.";
}
async function copyPrompt(j){
  const text = letterPrompt(j);
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* nothing else to try */ }
    ta.remove();
  }
  toast("Prompt copied. Paste it to Claude and it will read the posting and draft the note.");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-letter]");
  if (!b) return;
  const j = DATA.jobs.find(x => String(x.id) === b.dataset.letter);
  if (j) copyPrompt(j);
});
$("mLetter").addEventListener("click", () => { if (PENDING) copyPrompt(PENDING); });

// ---- applied panel ----
function renderApplied(){
  const ids = Object.keys(APPLIED)
    .sort((a,b) => (APPLIED[b].date || "").localeCompare(APPLIED[a].date || ""));
  $("appliedHead").textContent = ids.length
    ? ids.length + " application" + (ids.length === 1 ? "" : "s") + " logged"
    : "Nothing logged yet";
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const LABEL = {applied:"applied", replied:"replied", screen:"screen",
                 onsite:"onsite", offer:"offer", rejected:"rejected"};
  const today = Date.now();
  $("appliedList").innerHTML = ids.map(id => {
    const a = APPLIED[id];
    const stage = a.stage || "applied";
    const days = Math.floor((today - Date.parse(a.date + "T00:00:00")) / 86400000);
    const moved = stage !== "applied";
    const dead = stage === "rejected";
    // A req that vanished from the board after you applied was filled or pulled.
    // That is not a verdict on you, and it is the one thing silence cannot tell you.
    const gone = CLOSED[id];
    const stale = !moved && days >= 14;
    const note = gone
      ? '<span class="age" title="This posting disappeared from the company board. It was '
        + 'filled or pulled, which is not a verdict on your application.">closed +'
        + Math.max(0, Math.floor((gone.closed*1000 - Date.parse(a.date + "T00:00:00"))/86400000))
        + 'd</span>'
      : '<span class="age">' + (days === 0 ? "today" : days + "d, " + LABEL[stage]) + '</span>';
    return '<div class="pr' + (stale ? ' stale' : '') + '">'
      + '<span class="when">' + esc(a.date) + '</span>'
      + '<span class="stage' + (dead ? ' dead' : moved ? ' reply' : '') + '">' + LABEL[stage] + '</span>'
      + '<span class="grow"><a class="title" href="' + esc(a.url) + '" target="_blank" rel="noopener">'
      + esc(a.title) + '</a> &middot; ' + esc(a.company) + '</span>'
      + note
      + '<button data-edit="' + esc(id) + '">edit</button>'
      + '<button data-undo="' + esc(id) + '">undo</button></div>';
  }).join("") || '<div class="pr" style="color:var(--muted)">Mark a job as applied and it lands here.</div>';
}
$("appliedList").addEventListener("click", e => {
  const ed = e.target.closest("button[data-edit]");
  if (ed){
    const a = APPLIED[ed.dataset.edit];
    ask({id: ed.dataset.edit, title: a.title, company: a.company,
         location: a.location, score: a.score, url: a.url, liveDays: a.liveDays});
    return;
  }
  const b = e.target.closest("button[data-undo]");
  if (!b) return;
  delete APPLIED[b.dataset.undo];
  saveApplied(); renderApplied(); render();
});
$("appliedBtn").addEventListener("click", () => {
  const open = $("appliedPanel").hidden;
  $("appliedPanel").hidden = !open;
  $("appliedBtn").classList.toggle("on", open);
  if (open) renderApplied();
});
$("closeApplied").addEventListener("click", () => {
  $("appliedPanel").hidden = true; $("appliedBtn").classList.remove("on");
});

// ---- one CSV, one row per application ----
const csvCell = v => {
  const t = String(v ?? "");
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
$("exportBtn").addEventListener("click", () => {
  const ids = Object.keys(APPLIED).sort((a,b) => (APPLIED[a].date||"").localeCompare(APPLIED[b].date||""));
  if (!ids.length){ alert("Nothing to export yet."); return; }
  const head = ["date_applied","stage","stage_date","days_since_applied","req_closed",
                "company","title","location","score","live_days","url","job_id"];
  const now = Date.now();
  const rows = ids.map(id => {
    const a = APPLIED[id];
    const days = Math.floor((now - Date.parse(a.date + "T00:00:00")) / 86400000);
    return [a.date, a.stage || "applied", a.stageDate || a.date, days,
            CLOSED[id] ? "yes" : "", a.company, a.title, a.location,
            a.score, a.liveDays, a.url, id].map(csvCell).join(",");
  });
  const blob = new Blob([head.join(",") + "\n" + rows.join("\n") + "\n"], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "applications.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

// ---- import merges, never replaces ----
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCsv(String(rd.result));
    const head = rows.shift() || [];
    const ix = n => head.indexOf(n);
    let added = 0;
    rows.forEach(r => {
      const id = r[ix("job_id")];
      if (!id || APPLIED[id]) return;
      APPLIED[id] = { date: r[ix("date_applied")],
        stage: ix("stage") >= 0 ? (r[ix("stage")] || "applied") : "applied",
        stageDate: ix("stage_date") >= 0 ? r[ix("stage_date")] : r[ix("date_applied")],
        company: r[ix("company")], title: r[ix("title")], location: r[ix("location")],
        score: +r[ix("score")] || 0, liveDays: +r[ix("live_days")] || 0, url: r[ix("url")] };
      added++;
    });
    saveApplied(); renderApplied(); render();
    alert("Imported " + added + " new row" + (added === 1 ? "" : "s") + ". "
        + nApplied() + " application" + (nApplied() === 1 ? "" : "s") + " logged in total.");
  };
  rd.readAsText(f);
  e.target.value = "";
});

// ---- add a company ----
$("addCoBtn").addEventListener("click", () => {
  window.open("https://github.com/Parameshwaran-AA/job-watcher/actions/workflows/add-company.yml",
              "_blank", "noopener");
});

saveApplied();

fetch("jobs.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    CLOSED = Object.fromEntries((d.closed || []).map(c => [c.id, c]));
    const fresh = d.jobs.filter(j => (Date.now()/1000 - j.found) < 86400).length;
    $("status").innerHTML = "Swept <b>" + ago(d.generated) + "</b> &middot; <b>" + fresh
      + "</b> new in 24h &middot; <b>" + d.jobs.length + "</b> roles across <b>"
      + d.companies.length + "</b> companies";
    buildMenu(); updateBtnLabel();
    render();
    if (!$("appliedPanel").hidden) renderApplied();
  })
  .catch(() => {
    $("status").textContent = "No data yet";
    $("list").innerHTML = '<p class="empty">Run <code>python watcher.py run</code> to fill this page. '
      + 'The first sweep of each company records its jobs quietly without alerting, so run it twice '
      + 'before expecting anything new. If you opened this file directly, serve the folder instead: '
      + '<code>python -m http.server -d docs</code>.</p>';
  });
</script>
