# job-watcher configuration

[profile]
# The text every job description is compared against.
# HARD LIMIT: the embedding model (all-MiniLM-L6-v2) truncates at 256 word pieces,
# roughly 120-140 words once punctuation is counted. Anything past that is silently
# ignored, so keep this SHORT and put the role keywords FIRST. Check with:
#   .venv/bin/python -c "import tomllib,transformers as t; \
#     tk=t.AutoTokenizer.from_pretrained('sentence-transformers/all-MiniLM-L6-v2'); \
#     print(len(tk(tomllib.load(open('config.toml','rb'))['profile']['text'])['input_ids']))"
text = """
Seeking software engineer, backend engineer, machine learning engineer, AI engineer,
data engineer or MLOps engineer roles in the United States. Mid-level, 4 years.

Backend APIs in Java, Spring Boot, Python and FastAPI. Built the order management and
pricing platform at Ford serving 500K+ transactions a month and tuned MySQL schemas,
indexing and partitioning across millions of daily records.

Distributed data pipelines on Apache Spark, Apache Airflow and dbt Core modelled in
Snowflake. Kafka, ETL, PostgreSQL, MongoDB, Redis.

Production ML with PyTorch, Sentence Transformers, embeddings, RAG, FAISS and vector
search. Shipped a real-time forecasting inference service, a self-hosted embedding
search service, and an LLM serving gateway scheduling agent sessions across vLLM
replicas on Kubernetes GPU clusters.

Docker, Kubernetes, Helm, CI/CD, Prometheus, AWS.
"""

[match]
use_embeddings      = true   # false forces the dependency-free lexical scorer
role_families       = ["swe", "ai", "data"]
max_years_experience = 8     # a posting whose FLOOR is 8+ is dropped
min_score_keep      = 25     # below this, do not even store it
min_score_dashboard = 45     # below this, keep it but hide it from the site
min_score_notify    = 60     # below this, no Telegram push
                             # lexical scores run lower than embedding scores;
                             # run `watcher.py stats` after changing scorer
us_only             = true   # only alert on jobs that could be in the US.
                             # A blank or unreadable location counts as US, on the
                             # grounds that an unfilled field is usually an oversight.
                             # The dashboard has its own toggle, independent of this.
exclude_interns     = true   # never alert on internships, co-ops or apprenticeships.
                             # Title-based and deliberately narrow: "New Grad" and
                             # "Early Career" are real jobs and are NOT excluded.

[run]
database        = "jobs.db"
export_path     = "docs/jobs.json"
concurrency     = 8
request_timeout = 20
per_host_delay_ms = 120      # politeness gate, shared across all companies
max_jobs_per_company = 400   # stops one agency board flooding a run
close_after_missing_runs = 2 # missing from 2 good sweeps = the job is gone
dashboard_days  = 45         # rows older than this (by when WE first saw them) drop off the site
max_live_days   = 90         # hide postings open on the company site longer than this;
                             # a job live 1000+ days is a ghost. 0 disables the hide.

[telegram]
max_per_message = 10
# set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as environment variables
