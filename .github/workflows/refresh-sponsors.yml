name: refresh sponsors

# Rebuilds sponsors.json from the USCIS H-1B Employer Data Hub.
# The data only changes when USCIS publishes a new fiscal year, so quarterly is
# plenty. Run it by hand any time you add companies.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Fiscal years to pull (space separated)"
        default: "2023 2024 2025"
  schedule:
    - cron: "0 6 1 */3 *"      # 06:00 UTC on the 1st, every third month

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "httpx>=0.27"

      - name: Build sponsors.json
        run: |
          python tools/sponsors.py --years ${{ inputs.years || '2023 2024 2025' }} | tee out.txt
          test -s sponsors.json

      - name: Commit
        run: |
          git config user.name  "job-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add sponsors.json
          git diff --staged --quiet || git commit -m "refresh H-1B sponsor data"
          git push

      - name: Summary
        run: |
          { echo "### H-1B sponsor data"; echo '```'; tail -70 out.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
